<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
 <link rel="stylesheet" href="login.css">
 <title>Login Page</title>
</head>
<body>
 <header>
  <nav>
   <ul id="nav-menu">
    <li>
     <a href="dashboard.html"></a>
    </li>
   </ul>
   </nav>
 </header>
 <main>
   <section id="login-hero">
    <div class="login-container">
     <div class="login-card">
      <div class="login-icon">
       <i class="fa-solid fa-lock"></i>
      </div>
      <h2>Welcome Back!</h2>
      <p>Log in to your account to continue</p>
      <div class="email-container">
       <i class="fas fa-envelope"></i>
     <input type="email" id="email" placeholder="Email address" required>
      </div>
      <div class="password-container">
       <i class="fas fa-lock"></i>
       <input type="password" id="password" placeholder="Password" required>
       <i class="fas fa-eye-slash" id="toggle-password"></i>
      </div>
      <div class="remember-forgot">
      <label>
       <input type="checkbox" id="remember-me">Remember me
      </label>
      <a href="forget-password.html">Forgot Password?</a>
      </div>
      <button id="login">Login <i class="fas fa-arrow-right"></i></button>
      <p id="login-message"></p>
      <p class="eyebrow"><span></span>OR<span></span></p>
       <p class="signup-text">Don't have an account? <a href="sign-up.html">Sign up</a></p>
     </div>
    </div>
   </section>
   </main>
 <script src="login.js"></script>
</body>

</html>
