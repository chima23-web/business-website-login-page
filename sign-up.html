<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
 <link rel="stylesheet" href="login.css">
 <title>Login Page</title>
</head>
<body>
 <header>
  <nav>
   <ul id="nav-menu">
    <li>
     <a href="login.html"></a>
    </li>
   </ul>
   </nav>
 </header>
 <main>
   <section id="sign-up-hero">
    <div class="sign-up-container">
     <div class="sign-up-card">
      <div class="sign-up-icon">
       <i class="fa-solid fa-lock"></i>
      </div>
      <h2>Register!</h2>
      <p>Create an account to get started</p>
      <div class="email-container">
       <i class="fas fa-envelope"></i>
     <input type="email" id="email" placeholder="Email address" required>
      </div>
      <div class="password-container">
       <i class="fas fa-lock"></i>
       <input type="password" id="password" placeholder="Password" required>
       <div class="i" id="toggle-password">
        <i class="fa  fa-eye-slash"></i>
       </div>
      </div>
      <div class="remember-forgot">
      <label>
       <input type="checkbox" id="remember-me">Remember me
      </label>
      <a href="forget-password.html">Forgot Password?</a>
      </div>
      <button id="register">Register <i class="fas fa-arrow-right"></i></button>
      <p id="register-message"></p>
      <p class="eyebrow"><span></span>OR<span></span></p>
       <p class="sign-in-text">Don't have an account? <a href="sign-in.html">Sign in</a></p>
     </div>
    </div>
   </section>
   </main>
 <script src="sign-up.js"></script>
</body>

</html>
